# driver ci build
name: CI - edriver
on:
  push:
    branches: ["**"]
    paths:
      - "plugins/edriver/**"
      - "SDK/rust/**"
      - ".github/workflows/ci-edriver.yaml"
  pull_request:
    paths:
      - "plugins/edriver/**"
      - "SDK/rust/**"
      - ".github/workflows/ci-edriver.yaml"

jobs:
  edriver:
    name: "Build and test edriver / ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            lib_path: /usr/lib/x86_64-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            lib_path: /usr/lib/aarch64-linux-gnu
    steps:
      - name: "Git checkout"
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add musl target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/edriver/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-edriver-${{ hashFiles('plugins/edriver/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-edriver-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkgconf libelf-dev libzstd-dev linux-libc-dev musl-tools llvm-14 clang-14 protobuf-compiler
          for tool in clang llc llvm-strip
          do
            sudo rm -f /usr/bin/$tool
            sudo ln -s /usr/bin/${tool}-14 /usr/bin/$tool
          done

      - name: Build
        run: cd plugins/edriver && make build
        env:
          PLATFORM: ${{ matrix.arch }}
          LIBBPF_SYS_LIBRARY_PATH: ${{ matrix.lib_path }}
          TARGET_CC: gcc

      - name: Test
        run: cd plugins/edriver && make test
        env:
          PLATFORM: ${{ matrix.arch }}
          LIBBPF_SYS_LIBRARY_PATH: ${{ matrix.lib_path }}
          TARGET_CC: gcc
