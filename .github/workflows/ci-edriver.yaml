# driver ci build
name: CI - edriver
on:
  push:
    branches: ["**"]
    paths:
      - "plugins/edriver/**"
      - "SDK/rust/**"
      - ".github/workflows/ci-edriver.yaml"
  pull_request:
    paths:
      - "plugins/edriver/**"
      - "SDK/rust/**"
      - ".github/workflows/ci-edriver.yaml"

jobs:
  edriver:
    name: "Build and test edriver / ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            lib_path: /usr/lib/x86_64-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            lib_path: /usr/lib/aarch64-linux-gnu
    steps:
      - name: "Git checkout"
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add musl target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          # Intentionally do NOT cache plugins/edriver/target across commits:
          # Cargo's build-script fingerprint does not always invalidate on
          # [build].rustflags / config.toml changes, so a restored stale
          # target/ would reuse a build-script binary linked without -lzstd
          # and break the ZSTD fix. Re-linking from scratch is cheap; the
          # registry cache (much larger) still provides the speedup.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-edriver-registry-v2-${{ hashFiles('plugins/edriver/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-edriver-registry-v2-

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          # Install each package group on its own line so a single package
          # conflict (notably linux-libc-dev on ubuntu-24.04-arm) cannot
          # silently drop unrelated packages.
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          sudo apt-get install -y --no-install-recommends musl-tools
          # libbpf-sys is built with the `vendored` feature (via edriver's
          # `static` -> libbpf-rs/vendored). It compiles bundled libbpf,
          # elfutils and zlib from source, which needs the autotools stack
          # plus flex/bison/gettext/gperf to regenerate elfutils' configure.
          sudo apt-get install -y --no-install-recommends \
            pkgconf autoconf automake libtool m4 \
            autopoint gettext gperf flex bison gawk
          # BPF compilation toolchain
          sudo apt-get install -y --no-install-recommends clang llvm
          # build-essential occasionally conflicts on ARM via linux-libc-dev.
          sudo apt-get install -y --no-install-recommends build-essential || true

      - name: Verify toolchain and export PROTOC
        run: |
          set -euxo pipefail
          which protoc
          protoc --version
          echo "PROTOC=$(which protoc)" >> "$GITHUB_ENV"

      - name: Build
        run: cd plugins/edriver && make build
        env:
          PLATFORM: ${{ matrix.arch }}
          LIBBPF_SYS_LIBRARY_PATH: ${{ matrix.lib_path }}
          TARGET_CC: gcc

      - name: Test
        run: cd plugins/edriver && make test
        env:
          PLATFORM: ${{ matrix.arch }}
          LIBBPF_SYS_LIBRARY_PATH: ${{ matrix.lib_path }}
          TARGET_CC: gcc
