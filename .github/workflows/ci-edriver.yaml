# driver ci build
name: CI - edriver
on:
  push:
    branches: ["**"]
    paths:
      - "plugins/edriver/**"
      - "SDK/rust/**"
      - ".github/workflows/ci-edriver.yaml"
  pull_request:
    paths:
      - "plugins/edriver/**"
      - "SDK/rust/**"
      - ".github/workflows/ci-edriver.yaml"

jobs:
  edriver:
    name: "Build and test edriver / ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            lib_path: /usr/lib/x86_64-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            lib_path: /usr/lib/aarch64-linux-gnu
    steps:
      - name: "Git checkout"
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add musl target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/edriver/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-edriver-${{ hashFiles('plugins/edriver/Cargo.lock', 'plugins/edriver/.cargo/config.toml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-edriver-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # protobuf-compiler + musl-tools: keep together and away from linux-libc-dev.
          # linux-libc-dev can conflict with the runner's pre-installed version on
          # ubuntu-24.04-arm, causing the whole apt-get line to fail and silently
          # dropping protobuf-compiler (pattern from ci-agent / ci-collector).
          sudo apt-get install -y --no-install-recommends protobuf-compiler musl-tools
          # BPF build deps; linux-libc-dev is pre-installed on GitHub runners so
          # a version mismatch is common — allow failure.
          sudo apt-get install -y --no-install-recommends \
            build-essential pkgconf libelf-dev libzstd-dev || true
          sudo apt-get install -y linux-libc-dev || true
          # BPF compilation toolchain
          sudo apt-get install -y --no-install-recommends clang llvm

      - name: Build
        run: cd plugins/edriver && make build
        env:
          PLATFORM: ${{ matrix.arch }}
          LIBBPF_SYS_LIBRARY_PATH: ${{ matrix.lib_path }}
          TARGET_CC: gcc
          PROTOC: /usr/bin/protoc

      - name: Test
        run: cd plugins/edriver && make test
        env:
          PLATFORM: ${{ matrix.arch }}
          LIBBPF_SYS_LIBRARY_PATH: ${{ matrix.lib_path }}
          TARGET_CC: gcc
          PROTOC: /usr/bin/protoc
