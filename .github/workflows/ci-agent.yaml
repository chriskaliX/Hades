name: CI - agent

on:
  push:
    branches: ["**"]
    paths:
      - "agent/**"
      - ".github/workflows/ci-agent.yaml"
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/ci-agent.yaml"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. Unit tests + lint ────────────────────────────────────────────────────
  test:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: test-${{ github.job }}-cargo-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: test-cargo-

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: cargo test
        run: cargo test --manifest-path agent/Cargo.toml

      - name: clippy
        run: cargo clippy --manifest-path agent/Cargo.toml -- -D warnings

  # ── 2. Multi-arch build (musl static) ──────────────────────────────────────
  build:
    name: build / ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            use-cross: false          # native, musl-gcc is enough
          - target: aarch64-unknown-linux-musl
            use-cross: true           # cross-rs handles the toolchain
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: build-${{ matrix.target }}-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: build-${{ matrix.target }}-

      - name: Install protoc and musl-tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends protobuf-compiler musl-tools

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build (native musl)
        if: "!matrix.use-cross"
        run: cargo build --release --workspace --manifest-path agent/Cargo.toml --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --workspace --manifest-path agent/Cargo.toml --target ${{ matrix.target }}

      - name: Verify static binary
        run: |
          file agent/target/${{ matrix.target }}/release/hades-agent
          file agent/target/${{ matrix.target }}/release/hades-agent | grep -q "static" || (echo "NOT static!" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: hades-agent-${{ matrix.target }}
          path: |
            agent/target/${{ matrix.target }}/release/hades-agent
            agent/target/${{ matrix.target }}/release/hadesctl
          retention-days: 7

  # ── 3. Build .deb (both arches) ─────────────────────────────────────────────
  build-deb:
    name: build .deb / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            use-cross: false
            deb-arch: amd64
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            use-cross: true
            deb-arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: deb-${{ matrix.target }}-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: deb-${{ matrix.target }}-

      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deb
          key: cargo-deb-bin-${{ runner.os }}

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends protobuf-compiler musl-tools

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Install cargo-deb
        run: command -v cargo-deb || cargo install cargo-deb

      - name: Build (native musl)
        if: "!matrix.use-cross"
        run: cargo build --release --workspace --manifest-path agent/Cargo.toml --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --workspace --manifest-path agent/Cargo.toml --target ${{ matrix.target }}

      - name: Package .deb
        run: cargo deb --no-build --manifest-path agent/Cargo.toml --target ${{ matrix.target }} --output /tmp/

      - uses: actions/upload-artifact@v4
        with:
          name: hades-agent-deb-${{ matrix.arch }}
          path: /tmp/hades-agent_*.deb
          retention-days: 1

  # ── 4. Integration test — systemd ───────────────────────────────────────────
  integ-systemd:
    name: integ / systemd / ${{ matrix.arch }}
    needs: build-deb
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hades-agent-deb-${{ matrix.arch }}
          path: /tmp/

      - name: Install package
        run: sudo dpkg -i /tmp/hades-agent_*.deb

      - name: Verify unit is enabled
        run: systemctl is-enabled hades-agent

      - name: Start agent
        run: sudo systemctl start hades-agent || true

      - name: Wait for startup
        run: sleep 3

      - name: hadesctl status
        run: sudo /etc/hades/hadesctl status

      - name: hadesctl stop
        run: sudo /etc/hades/hadesctl stop || true

      - name: Disable service
        run: sudo /etc/hades/hadesctl disable

  # ── 5. Integration test — sysvinit (no systemd) ─────────────────────────────
  integ-sysvinit:
    name: integ / sysvinit / ${{ matrix.arch }}
    needs: build-deb
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:24.04
      options: --privileged
    steps:
      - name: Install runtime dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends cron

      - uses: actions/download-artifact@v4
        with:
          name: hades-agent-deb-${{ matrix.arch }}
          path: /tmp/

      - name: Install package
        run: dpkg -i /tmp/hades-agent_*.deb || true

      - name: Force sysvinit mode
        run: |
          /etc/hades/hadesctl set --service_type=sysvinit
          /etc/hades/hadesctl disable || true
          /etc/hades/hadesctl enable

      - name: Start agent
        run: /etc/hades/hadesctl start || true

      - name: Verify process spawned
        run: |
          sleep 3
          PID_FILE=/var/run/hades-agent.pid
          if [ -f "$PID_FILE" ]; then
            PID=$(cat "$PID_FILE")
            echo "PID file found: $PID"
            kill -0 "$PID" 2>/dev/null && echo "Process is alive" \
              || echo "Process exited (expected: no gRPC server)"
          else
            echo "PID file not found — hadesctl start may have failed"
            exit 1
          fi

      - name: hadesctl status
        run: /etc/hades/hadesctl status || true

      - name: hadesctl stop
        run: /etc/hades/hadesctl stop || true
