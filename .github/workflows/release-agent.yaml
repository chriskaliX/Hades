name: Hades-agent

on:
  push:
    tags:
      - agent-v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agent/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('agent/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm

      - name: Extract version from tag
        run: |
          TAG=${GITHUB_REF#refs/tags/agent-v}
          echo "BUILD_VERSION=${TAG}" >> $GITHUB_ENV

      - name: Build .deb
        run: cd agent/deploy && make deb

      - name: Build .rpm
        run: cd agent/deploy && make rpm

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: hades-agent-packages
          path: /tmp/hades-agent*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: hades-agent-packages
          path: /tmp/packages

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: Release ${{ github.ref_name }}
          files: /tmp/packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    needs:
    - build
