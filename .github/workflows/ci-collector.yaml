name: CI - collector

on:
  push:
    branches: ["**"]
    paths:
      - "plugins/collector/**"
      - "SDK/rust/**"
      - ".github/workflows/ci-collector.yaml"
  pull_request:
    paths:
      - "plugins/collector/**"
      - "SDK/rust/**"
      - ".github/workflows/ci-collector.yaml"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. Unit tests + lint ────────────────────────────────────────────────────
  test:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/collector/target
          key: test-collector-${{ hashFiles('plugins/collector/Cargo.lock') }}
          restore-keys: test-collector-

      - name: cargo test
        run: cargo test --manifest-path plugins/collector/Cargo.toml

      - name: clippy
        run: cargo clippy --manifest-path plugins/collector/Cargo.toml -- -D warnings

  # ── 2. Build (musl static) ──────────────────────────────────────────────────
  build:
    name: build (x86_64-musl)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/collector/target
          key: build-collector-x86_64-musl-${{ hashFiles('plugins/collector/Cargo.lock') }}
          restore-keys: build-collector-x86_64-musl-

      - name: Install musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build
        run: cd plugins/collector && make

      - name: Strip & checksum
        run: |
          strip plugins/collector/collector
          sha256sum plugins/collector/collector

      - uses: actions/upload-artifact@v4
        with:
          name: collector-x86_64
          path: plugins/collector/collector
          retention-days: 3
