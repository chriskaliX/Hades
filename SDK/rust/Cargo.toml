[package]
name = "sdk"
version = "0.1.0"
authors = ["chriskali <chriskalix@protonmail.com>"]
edition = "2021"

[features]
debug = []

[dependencies]
log           = { version = "0.4", features = ["std"] }
chrono        = "0.4"
flate2        = "1"
crossbeam     = "0.8"
lazy_static   = "1.4"
anyhow        = "1"
prost         = "0.14"
parking_lot   = "0.12"
signal-hook   = "0.3.14"
libc          = "0.2"
serde_json    = "1"
twox-hash     = "1.6"
lru-cache     = "0.1.2"
hex           = "0.4"
coarsetime    = "0.1"
tokio         = { version = "1", features = ["full"] }

[build-dependencies]
prost-build = "0.14"