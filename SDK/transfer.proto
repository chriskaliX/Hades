syntax = "proto3";
package protocol;
option go_package = "protocol";

message Record {
    int32 data_type = 1;
    int64 timestamp = 2;
    Payload data = 3;
}

message Payload { map<string, string> fields = 1; }

message Task {
    int32 data_type = 1;
    string object_name = 2;
    string data = 3;
    string token = 4;
}

// Task command types sent from the server to a plugin.
enum TaskCmd {
    TASK_SHUTDOWN = 0;
    TASK_UPDATE   = 1;
    TASK_SETENV   = 2;
    TASK_RESTART  = 3;
}