[env]
LIBBPF_SYS_LIBRARY_PATH_x86_64_unknown_linux_gnu  = "/usr/lib/x86_64-linux-gnu:/usr/lib64:/usr/lib"
LIBBPF_SYS_LIBRARY_PATH_aarch64_unknown_linux_gnu = "/usr/lib/aarch64-linux-gnu:/usr/lib64:/usr/lib"
LIBBPF_SYS_LIBRARY_PATH_x86_64_unknown_linux_musl  = "/usr/lib/x86_64-linux-musl:/usr/lib/x86_64-linux-gnu:/usr/lib64:/usr/lib"
LIBBPF_SYS_LIBRARY_PATH_aarch64_unknown_linux_musl = "/usr/lib/aarch64-linux-musl:/usr/lib/aarch64-linux-gnu:/usr/lib64:/usr/lib"
# libbpf-sys compiles libbpf C sources using the native gcc.
# For musl targets, we must use musl-gcc so libbpf C code is compiled against
# musl headers (not glibc headers). With glibc headers, _FORTIFY_SOURCE
# injects __snprintf_chk/__sprintf_chk/__realpath_chk etc., which musl doesn't
# provide. musl-gcc wraps gcc with the musl specs (-specs .../musl-gcc.specs)
# and points include paths to musl headers.
CC_x86_64_unknown_linux_musl  = "musl-gcc"
CC_aarch64_unknown_linux_musl = "musl-gcc"

# libbpf-sys/static links the system libelf.a.  On Ubuntu 24.04+ that libelf.a
# is compiled with USE_ZSTD, referencing ZSTD_* symbols that libbpf-sys never
# emits `cargo:rustc-link-lib=zstd` for.  We add -lzstd manually:
#
# [build].rustflags applies to build-script binaries (HOST triple), which is
# where libbpf-cargo -> libbpf-sys runs.  Dynamic libzstd.so is fine for the
# host build-script executable.
[build]
rustflags = ["-C", "link-arg=-lzstd"]

# For the final musl binary, libbpf-sys also emits `cargo:rustc-link-lib=static=elf`
# and the same ZSTD symbols need resolving.  We force static libzstd here so
# the binary remains self-contained: -Wl,-Bstatic,-lzstd,-Bdynamic forces static
# for zstd only; libzstd.a is supplied by libzstd-dev in CI.
# libbpf-sys already emits cargo:rustc-link-search for the LIBBPF_SYS_LIBRARY_PATH
# dirs above, so the linker can find libzstd.a in e.g. /usr/lib/x86_64-linux-gnu/.
[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-Wl,-Bstatic,-lzstd,-Bdynamic"]

[target.aarch64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-Wl,-Bstatic,-lzstd,-Bdynamic"]
