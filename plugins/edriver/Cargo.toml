[package]
name = "edriver"
version = "0.2.2"
edition = "2021"
authors = ["chriskali <chriskalix@protonmail.com>"]
description = "Rust version of hades edriver"

[features]
debug = ["sdk/debug"]
# The `static` feature chains to libbpf-rs/static → libbpf-sys/static, which
# links the system libelf.a.  On Ubuntu 24.04+ that libelf.a is compiled with
# USE_ZSTD and references ZSTD_* symbols.  libbpf-sys does NOT emit
# `cargo:rustc-link-lib=zstd`, so we must add `-lzstd` manually in
# .cargo/config.toml ([build].rustflags for host build-scripts, and
# [target.*-musl].rustflags for the final binary).
static = ["libbpf-rs/static"]

[dependencies]
anyhow = "1.0"
log = { version = "0.4", features = ["std"] }
libc = "0.2.186"
users = "0.11.0"
governor = "0.10.4"
lazy_static = "1.5.0"
twox-hash = "2.1"
hex = "0.4"
libbpf-rs = { version = "0.26.2", features = ["static"] }
# Add vendored-zlib directly so libbpf-sys compiles zlib from its vendored
# source (using CC_x86_64_unknown_linux_musl=musl-gcc set in .cargo/config.toml)
# instead of linking the system libz.a.  The system libz.a on Ubuntu is
# compiled with glibc headers (_FORTIFY_SOURCE=2), which generates
# __snprintf_chk / __vsnprintf_chk calls that musl doesn't provide.
# Compiling zlib from source with musl-gcc uses musl headers and avoids these.
libbpf-sys = { version = "1.7", features = ["vendored-zlib"] }
bitflags = "2.11.1"
moka = { version = "0.12", features = ["sync"] }
sdk = { path = "../../SDK/rust" }

[build-dependencies]
libbpf-cargo = "0.26.2"
cc = "1"
# NOTE: Do NOT add libbpf-sys with features=["static"] here.
# libbpf-cargo depends on libbpf-rs (default-features=false) → libbpf-sys
# (no static). If we pin static here, the HOST build-script binary links
# system libelf.a which on Ubuntu 24.04+ is compiled with USE_ZSTD and
# references ZSTD_* symbols that libbpf-sys never emits as link-lib.
# The static feature is only needed for the final binary, which is covered
# by [dependencies] libbpf-rs/static → libbpf-sys/static.
